background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.15
}

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(10, 10, 12, 0.5)
    font_color = rgba(255, 255, 255, 0.92)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff88">welcome.</span>
    hide_input = false
    check_color = rgba(255, 255, 255, 0.9)
    fail_color = rgba(255, 100, 100, 1.0)
    fail_text = <span foreground="##ff6464">nuh uh</span>
    capslock_color = rgba(255, 200, 150, 1.0)
    position = 0, -60
    halign = center
    valign = center
    rounding = 20
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##ffffff'>$(date +'%H:%M')</span>"
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span foreground='##ffffffcc'>$(date +'%d.%m.%Y')</span>"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
